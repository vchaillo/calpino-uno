name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"
      timezone: "Europe/Paris"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.release.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        run: python3 scripts/check-statistics.py
  deploy:
    needs: check
    if: github.event_name != 'schedule' || needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check firebase-client.js && node --check account-store.js && node --check account-data.js && node --check teams.js && node --check app.js && node --check branding.js && node --check statistics.js && node --check profile.js && node --check season-display.js && node --check cockpit.js && node --check circuits.js && node --check calendar.js && node --check flags.js && node --check table-sort.js && node --check icons.js && node --check view-layout.js && node --check world-map.js
      - name: Verify account isolation
        run: node --test tests/account-store.test.mjs
      - name: Refresh career statistics
        run: python3 scripts/refresh-statistics.py
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p dist
          cp firebase-client.js account-store.js account-data.js teams.js index.html app.js branding.js statistics.js profile.js season-display.js cockpit.js circuits.js calendar.js flags.js table-sort.js icons.js view-layout.js world-map.js styles.css favicon.svg dist/
          cp -r data assets dist/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
